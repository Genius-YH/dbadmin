{% extends 'base.html' %}
{% block content %}
<h2>{{ schema }}.{{ table_name }}</h2>
<p>최대 200개 행만 표시합니다.</p>

<h3>행 추가</h3>
<form method="post" action="{{ url_for('table_insert', conn=conn_name, schema=schema, table_name=table_name) }}" class="card">
  <input type="hidden" name="conn" value="{{ conn_name }}">
  {% for c in columns %}
    <label>{{ c }} <input name="{{ c }}" /></label>
  {% endfor %}
  <button type="submit">Insert</button>
</form>

<h3>데이터</h3>
<table>
  <thead><tr>{% for c in columns %}<th>{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>
    {% for row in rows %}<tr>{% for c in columns %}<td>{{ row[c] }}</td>{% endfor %}</tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
